server {
  listen 80;

  # React app: send unknown paths to index.html so client-side routes work on refresh
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # API calls go to the backend container
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }
}
